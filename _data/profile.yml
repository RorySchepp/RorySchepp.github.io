# About section: one entry per paragraph
bio:
  - >-
    Hi, I'm Rory. I grew up just outside Halifax, and the city has always felt
    like home, so I stayed for university. Math has always been the thing I'm
    most interested in, so studying it felt like the natural choice.
  - >-
    Right now I'm doing my master's at Dalhousie, working on generators and
    relations for groups of rational orthogonal matrices. Before that, I spent
    a couple of summers working on quantum circuits and lattice surgery. Next,
    I'm hoping to do a PhD.
  - >-
    When I'm not doing math, I'm usually with my friends or my three dogs,
    Lydia, Luna and Mayzee.

