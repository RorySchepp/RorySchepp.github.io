# Research interests: shown as a paragraph at the top of the Research section.
interests: >-
  Group theory, including presentations of groups and matrix groups;
  combinatorial and computational algebra; quantum computing, including
  quantum circuit synthesis, compilation and fault-tolerant quantum
  computation; categorical and diagrammatic methods (ZX-calculus);
  reversible computing.

# Research projects, newest first.
#   title:   project name
#   when:    dates, shown on the right
#   details: short facts, joined with " · " (Markdown links allowed)
#   status:  small tag shown after the title, e.g. In progress (optional)
#   blurb:   one-sentence plain-language summary (optional)
#   points:  bullet points with more technical detail (optional)
projects:
  - title: "Master's thesis: relations for O(ℚ, n)"
    when: 2025 – present
    status: In progress
    details:
      - Dalhousie University
      - "Supervisor: [Dr. Neil J. Ross](https://www.mathstat.dal.ca/~neilr/)"
    blurb: Understanding a group of matrices through the simple rules its building blocks follow.
    points:
      - Showed that O<sub>n</sub>(ℚ) is generated by 4-level matrices, i.e., matrices that act nontrivially on at most four coordinates.
      - Gave a complete presentation (generators and defining relations) of O<sub>n</sub>(ℚ) in terms of *n*-level matrices, which act nontrivially on all *n* coordinates.
      - Currently deriving a complete set of relations for the 4-level generators.
      - Showed that O<sub>n</sub>(ℚ(*i*)) is generated by 2-level matrices; continuing to work on the relations among these generators.

  - title: ZX-calculus for lattice surgery compilation
    when: Summer 2025
    details:
      - Summer research assistant, Dalhousie University
      - "Supervisor: Dr. Christopher Dean"
    blurb: Finding ways to make quantum programs cheaper to run on future error-corrected quantum computers.
    points:
      - Developed a ZX-calculus framework for compiling quantum circuits into lattice surgery operations.
      - Defined lattice surgery compatibility and showed that every Clifford+T circuit admits a compatible diagram.
      - Identified ZX-calculus rewrite rules that preserve compatibility.
      - Designed a procedure for embedding lattice surgery operations in three-dimensional space-time using approximate Steiner trees.

  - title: Relations for reversible circuits
    when: Summer 2024
    details:
      - Summer research assistant, Dalhousie University
      - "Co-supervisors: Dr. Dongho Lee and Dr. Christopher Dean"
    blurb: Looking for the basic rules that tell you when two reversible circuits do the same thing.
    points:
      - Investigated generators and relations for reversible Boolean and ternary circuits.
      - Used computational searches to explore finite presentations and identify potential relations among known generators.
